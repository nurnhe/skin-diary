<title>Skin Diary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* Layout: a soft "today" ritual card up top (sunrise + twilight), then the week as seven glassy day cards; a side sheet edits a day. */
:root {
  --bg: #FBF4F7; --bg-2: #F1EAFB; --glow-1: #FFD9E6; --glow-2: #E4DBFF; --glow-3: #E3F6D9;
  --surface: rgba(255, 255, 255, .72); --surface-solid: #FFFFFF; --ink: #2B1F33; --muted: #8A7B93; --line: rgba(122, 76, 130, .14);
  --accent: #A23B7C; --accent-ink: #FFFFFF; --accent-soft: #F7E1EE; --lime: #B6D94C;
  --am-1: #FFE7D1; --am-2: #FFF4C9; --am-ink: #B0631A;
  --pm-1: #E6E0FF; --pm-2: #D6E2FF; --pm-ink: #5B4BB5;
  --warn: #B4462A; --warn-soft: #FDE8E0; --ok: #3E8A5C;
  --shadow: 0 1px 2px rgba(80, 40, 90, .05), 0 10px 30px rgba(120, 60, 130, .09);
  --shadow-lg: 0 24px 60px rgba(70, 30, 80, .22);
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
  --s0: #E89BB5; --s1: #7FB8E6; --s2: #F08A7E; --s3: #7FCFB0; --s4: #F2C14E; --s5: #C65BA0; --s6: #A99BF0; --s7: #C9A0C9; --s8: #F5A623;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17111C; --bg-2: #1C1428; --glow-1: rgba(162, 59, 124, .28); --glow-2: rgba(91, 75, 181, .28); --glow-3: rgba(182, 217, 76, .10);
  --surface: rgba(38, 28, 46, .72); --surface-solid: #261C2E; --ink: #F3EAF5; --muted: #B3A3BC; --line: rgba(230, 200, 240, .12);
  --accent: #EE8CC6; --accent-ink: #2B1F33; --accent-soft: #3A2238; --lime: #C6E46A;
  --am-1: #3A2A1E; --am-2: #352F1C; --am-ink: #F5BE7A; --pm-1: #262245; --pm-2: #1F2A45; --pm-ink: #B9AEFF;
  --warn: #F29A7A; --warn-soft: #3B2220; --ok: #7FD1A0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); --shadow-lg: 0 24px 60px rgba(0,0,0,.6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #17111C; --bg-2: #1C1428; --glow-1: rgba(162, 59, 124, .28); --glow-2: rgba(91, 75, 181, .28); --glow-3: rgba(182, 217, 76, .10);
  --surface: rgba(38, 28, 46, .72); --surface-solid: #261C2E; --ink: #F3EAF5; --muted: #B3A3BC; --line: rgba(230, 200, 240, .12);
  --accent: #EE8CC6; --accent-ink: #2B1F33; --accent-soft: #3A2238; --lime: #C6E46A;
  --am-1: #3A2A1E; --am-2: #352F1C; --am-ink: #F5BE7A; --pm-1: #262245; --pm-2: #1F2A45; --pm-ink: #B9AEFF;
  --warn: #F29A7A; --warn-soft: #3B2220; --ok: #7FD1A0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); --shadow-lg: 0 24px 60px rgba(0,0,0,.6); color-scheme: dark }

* { box-sizing: border-box }
html { min-height: 100% }
body { min-height: 100%; color: var(--ink); font: 300 15px/1.55 var(--sans);
  background: radial-gradient(900px 500px at 8% -5%, var(--glow-1), transparent 60%), radial-gradient(800px 520px at 100% 10%, var(--glow-2), transparent 60%),
    radial-gradient(700px 400px at 50% 110%, var(--glow-3), transparent 60%), linear-gradient(180deg, var(--bg), var(--bg-2)); background-color: var(--bg); background-attachment: fixed }
.bottom-nav { display: none }
@media (max-width: 700px) {
  header.top nav.tabs { display: none }
  .brand h1 { font-size: 40px }
  .brand .eyebrow { display: none }
  .wrap { padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); gap: 18px }
  .bottom-nav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
    background: var(--surface); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line) }
  .bottom-nav button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11.5px; font-weight: 500; color: var(--muted); border-radius: 14px; -webkit-tap-highlight-color: transparent }
  .bottom-nav svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; padding: 2px 14px; box-sizing: content-box; border-radius: 999px; transition: background .2s }
  .bottom-nav svg[viewBox="0 0 48 48"] { stroke-width: 3.2 }
  .bottom-nav svg[viewBox="0 0 48 48"] * { stroke: currentColor }
  .bottom-nav button[aria-current="page"] { color: var(--accent) }
  .bottom-nav button[aria-current="page"] svg { background: var(--accent-soft) }
  .today { padding: 12px; gap: 12px }
  .ritual { padding: 14px 12px 10px }
  .step { grid-template-columns: 24px 36px minmax(0, 1fr); padding: 6px 4px }
  .step .thumb { width: 36px !important; height: 36px !important }
  .steps li { grid-template-columns: 14px minmax(0, 1fr) auto; gap: 4px }
  .skip-btn { padding: 6px 8px }
}
.wrap { max-width: 1260px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 26px }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance }
h1 { font-family: var(--serif); font-size: clamp(44px, 7vw, 68px); line-height: .95; letter-spacing: -.02em }
h1 em { color: var(--accent) }
h2 { font-family: var(--serif); font-size: 30px; line-height: 1.1 }
h3 { font-family: var(--serif); font-size: 22px; line-height: 1.1 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }
.eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 24px }
.brand { display: grid; gap: 6px }
nav.tabs { display: flex; gap: 2px; background: var(--surface); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: var(--shadow) }
nav.tabs button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font-weight: 400; color: var(--muted); transition: background .2s, color .2s }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); font-weight: 500 }

.glass { background: var(--surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow) }

/* Today */
.today { padding: 22px; display: grid; grid-template-columns: minmax(180px, .8fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: stretch }
.today-intro { display: grid; align-content: start; gap: 16px; padding: 6px; min-width: 0 }
.today-intro .date { font-family: var(--serif); font-size: 40px; line-height: 1 }
.today-intro .date em { color: var(--accent) }
.today-intro .rating button { padding: 4px 11px; font-size: 13px }
.today-note { margin: 0; font-family: var(--serif); font-style: italic; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere }
.ritual { border-radius: 20px; padding: 18px 18px 14px; display: grid; gap: 10px; align-content: start; min-width: 0 }
.ritual.am { background: linear-gradient(140deg, var(--am-1), var(--am-2)) }
.ritual.pm { background: linear-gradient(140deg, var(--pm-1), var(--pm-2)) }
.ritual-head { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.ritual.am h3 { color: var(--am-ink) }
.ritual.pm h3 { color: var(--pm-ink) }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; counter-reset: st }
.steps li { counter-increment: st; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 15px }
.steps li::before { content: counter(st); font-family: var(--serif); font-size: 18px; color: var(--muted); text-align: right }
.step { display: grid; grid-template-columns: 22px 40px minmax(0, 1fr); gap: 10px; align-items: center; padding: 5px 8px; border-radius: 12px; cursor: pointer; transition: background .15s }
.step:hover { background: color-mix(in srgb, var(--surface-solid) 55%, transparent) }
.step input { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--muted) 60%, transparent); background: var(--surface-solid); display: grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s }
.step input::after { content: "✓"; font-size: 13px; line-height: 1; color: #fff; opacity: 0 }
.step input:checked { background: var(--ok); border-color: var(--ok) }
.step input:checked::after { opacity: 1 }
.step .txt { overflow-wrap: anywhere }
.step .sub { display: block; font-size: 12px; color: var(--muted) }
.steps li.skipped .txt { color: var(--muted) }
.steps li.skipped .nm { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 70%, transparent) }
.skip-btn { border: 1px solid transparent; background: none; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap }
.skip-btn:hover { border-color: var(--line); background: var(--surface-solid); color: var(--ink) }
.skip-btn[aria-pressed="true"] { color: var(--warn); background: var(--warn-soft) }
.thumb { display: inline-grid; place-items: center; border-radius: 12px; object-fit: cover; flex: none; background: var(--surface-solid); box-shadow: 0 0 0 1px var(--line) }
.thumb.icon { background: color-mix(in srgb, var(--c) 20%, var(--surface-solid)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent) }
.thumb.icon svg { width: 60%; height: 60%; color: var(--c) }
.icon-pick { border: 0; padding: 0; background: none; border-radius: 16px; display: block }
.icon-pick .thumb { border-radius: 16px; transition: transform .15s }
.icon-pick:hover .thumb { transform: scale(1.06) }
.mini-icon { width: 14px; height: 14px; color: var(--c); display: grid }
.mini-icon svg { width: 14px; height: 14px }
.icon-grid { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px }
.icon-grid button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--c); display: grid; place-items: center }
.icon-grid button svg { width: 22px; height: 22px }
.icon-grid button[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 22%, var(--surface-solid)); border-color: var(--c) }
.complete-badge { justify-self: start; display: inline-flex; align-items: center; gap: 6px; background: var(--ok); color: #fff; font-weight: 500; font-size: 13px; padding: 4px 12px; border-radius: 999px }
.complete-badge.small { font-size: 11.5px; padding: 2px 9px; margin-inline: 4px }
.day.is-complete { background: color-mix(in srgb, var(--ok) 9%, var(--surface)) }
details summary { cursor: pointer; font-size: 13.5px; color: var(--muted); padding: 4px 2px }
details summary:hover { color: var(--ink) }
.tick { font-size: 11px; color: var(--ok); font-weight: 600 }
.tick.skip { color: var(--warn) }
.slot li.skipped > span:nth-child(2) { text-decoration: line-through; color: var(--muted) }
.ins { display: grid; gap: 6px }
.ins-row { display: grid; grid-template-columns: minmax(130px, 1fr) minmax(0, 1.4fr) minmax(0, 1.4fr); gap: 8px 18px; align-items: center; padding: 10px 14px; border-radius: 16px; background: var(--surface-solid); border: 1px solid var(--line) }
.ins-name { display: flex; gap: 8px; align-items: center; font-weight: 500 }
.ins-col { display: grid; grid-template-columns: 58px minmax(60px, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden }
.bar span { display: block; height: 100%; border-radius: 999px }
.bar.with span { background: var(--ok) }
.bar.without span { background: var(--muted) }
.val { white-space: nowrap }
@media (max-width: 700px) { .ins-row { grid-template-columns: minmax(0, 1fr) } }
.done-btn { border: 1px solid var(--line); background: var(--surface-solid); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center }
.done-btn[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff }

/* Week */
.weekbar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px }
.weekbar h2 { margin-right: auto }
a.btn { text-decoration: none; color: inherit }
.btn { border: 1px solid var(--line); background: var(--surface-solid); border-radius: 999px; padding: 7px 14px; font-weight: 400; transition: border-color .2s, transform .2s }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500 }
.btn.ghost { background: none; border-color: transparent; color: var(--muted) }
.btn.small { padding: 4px 11px; font-size: 13px }
.pager { display: flex; gap: 6px }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px }
.day { text-align: left; padding: 14px 12px 12px; border-radius: 22px; display: grid; gap: 10px; align-content: start; min-width: 0; transition: transform .2s, box-shadow .2s; color: var(--ink) }
.day:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg) }
.day.is-today { box-shadow: 0 0 0 2px var(--lime), var(--shadow) }
.day.is-past { opacity: .82 }
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding-inline: 4px }
.day-head .dow { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.day-head .num { font-family: var(--serif); font-size: 34px; line-height: .9; font-variant-numeric: tabular-nums }
.day.is-today .num { color: var(--accent); font-style: italic }
.tag { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); justify-self: start; margin-inline: 4px }
.slot { border-radius: 16px; padding: 9px 10px; display: grid; gap: 5px; min-width: 0 }
.slot.am { background: linear-gradient(140deg, var(--am-1), var(--am-2)) }
.slot.pm { background: linear-gradient(140deg, var(--pm-1), var(--pm-2)) }
.slot-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase }
.slot.am .slot-head { color: var(--am-ink) }
.slot.pm .slot-head { color: var(--pm-ink) }
.slot ol { margin: 0; padding: 0; list-style: none; font-size: 13px; display: grid; gap: 2px }
.slot li > span:nth-child(2) { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.slot li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 7px; align-items: center; overflow-wrap: anywhere; line-height: 1.35 }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted) }
.slot .empty { font-size: 13px; color: var(--muted) }
.done-mark { width: 16px; height: 16px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 10px; letter-spacing: 0 }
.edited { text-transform: none; letter-spacing: 0; font-weight: 400; font-style: italic; font-family: var(--serif); font-size: 13px }
.day-foot { display: flex; flex-wrap: wrap; gap: 4px; padding-inline: 4px }
.mini { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--surface-solid); border: 1px solid var(--line); color: var(--muted) }
.mini.warn { color: var(--warn); border-color: transparent; background: var(--warn-soft) }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted) }
.legend span { display: inline-flex; gap: 6px; align-items: center }

@media (max-width: 1000px) {
  .today { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
  .today-intro { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between }
  .week { grid-template-columns: minmax(0, 1fr) }
  .day { grid-template-columns: 70px minmax(0, 1fr) minmax(0, 1fr); align-items: start }
  .day-head { flex-direction: column; align-items: start; gap: 2px; grid-row: span 3 }
  .day .tag, .day-foot { grid-column: 2 / -1 }
}
@media (max-width: 600px) {
  .today { grid-template-columns: minmax(0, 1fr); padding: 14px }
  .day { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
  .day-head { grid-column: 1 / -1; grid-row: auto; flex-direction: row; align-items: baseline; justify-content: start; gap: 10px }
  .day .tag, .day-foot { grid-column: 1 / -1 }
}

.panel { padding: 22px; display: grid; gap: 14px; min-width: 0 }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px }
.tpl-grid .day-head { flex-direction: row }
.empty-state { text-align: center; padding: 48px 20px; display: grid; gap: 12px; justify-items: center }
.empty-state p { max-width: 46ch; margin: 0 }

/* Products */
.prod-list { display: grid; gap: 8px }
.prod-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 16px; background: var(--surface-solid); border: 1px solid var(--line) }

.prod-row .nm { font-weight: 500 }
.prod-row .br { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.edit-prod { display: grid; gap: 8px; min-width: 0 }
.acts { display: flex; gap: 2px; flex-wrap: wrap; justify-content: end }
.prod-row select { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 13px; max-width: 170px }
@media (max-width: 600px) { .prod-row { grid-template-columns: 56px minmax(0, 1fr) } .prod-row select, .prod-row .acts { grid-column: 2 } }
.chip { display: inline-block; font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 4px; vertical-align: 1px }
.chip.retinoid, .chip.acid { background: var(--warn-soft); color: var(--warn) }
.chip.spf { background: var(--am-2); color: var(--am-ink) }
.add-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; align-items: end }
.field { display: grid; gap: 5px; font-size: 13px; color: var(--muted) }
.input { border: 1px solid var(--line); background: var(--surface-solid); border-radius: 14px; padding: 9px 12px; color: var(--ink); width: 100% }
.kinds-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px }
.kinds-row label { display: inline-flex; gap: 6px; align-items: center }
.kinds-row input { accent-color: var(--accent) }
.suggest { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px }
.suggest .card { border-radius: 20px; padding: 16px; display: grid; gap: 8px; align-content: start; background: linear-gradient(150deg, var(--accent-soft), var(--surface-solid)); border: 1px solid var(--line) }
.suggest .card b { font-family: var(--serif); font-weight: 400; font-size: 20px; line-height: 1.15 }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(40, 20, 45, .35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 20 }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface-solid); z-index: 21; box-shadow: var(--shadow-lg);
  display: grid; grid-template-rows: auto minmax(0, 1fr); border-radius: 28px 0 0 28px;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px) }
@media (max-width: 520px) { .sheet { border-radius: 0 } }
.sheet-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; padding: 22px 22px 14px; border-bottom: 1px solid var(--line) }
.sheet-head h2 { font-size: 32px }
.sheet-body { overflow-y: auto; padding: 18px 22px 32px; display: grid; gap: 20px; align-content: start }
.sec { display: grid; gap: 10px; border-radius: 20px; padding: 14px }
.sec.am { background: linear-gradient(140deg, var(--am-1), var(--am-2)) }
.sec.pm { background: linear-gradient(140deg, var(--pm-1), var(--pm-2)) }
.sec.plain { padding: 0 }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap }
.sec.am h3 { color: var(--am-ink) }
.sec.pm h3 { color: var(--pm-ink) }
.picks { display: grid; gap: 5px }
.pick { display: grid; grid-template-columns: 18px 34px minmax(0, 1fr); gap: 2px 10px; align-items: center; padding: 8px 12px; border-radius: 14px; background: color-mix(in srgb, var(--surface-solid) 55%, transparent); cursor: pointer; transition: background .15s }
.pick:has(input:checked) { background: var(--surface-solid); box-shadow: 0 0 0 1.5px var(--accent) }

  if (s.type === "import") {

    body = `<div class="sec plain" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px"><span class="muted">Prefer a spreadsheet? Get the Excel template, fill it in, then import it below.</span><a class="btn small" href="https://nurnhe.github.io/skin-diary/routine-template.xlsx" download target="_blank" rel="noopener">Get template</a></div>
      <div class="sec plain"><label for="imp-text"><h3>Paste your products</h3></label>
        <p class="muted" style="margin:0 0 8px">One product per line, as <b>Brand - Product name</b>. Put them under <b>Morning</b> and <b>Evening</b> headings. Products with no heading go into both, except sunscreen (mornings) and retinol or acids (evenings). Each step is guessed from the name, and you can change it on your shelf.</p>
        <textarea class="input" id="imp-text" rows="11" style="resize:vertical" placeholder="Morning\nCOSRX - Low pH Good Morning Gel Cleanser\nEtude - SoonJung 2x Barrier Intensive Cream\nLa Roche-Posay - Anthelios UVMune 400 SPF 50+\n\nEvening\nBanila Co - Clean It Zero Cleansing Balm\nThe Ordinary - Retinal 0.2% Emulsion\nCeraVe - Moisturising Cream">${esc(s.text || "")}</textarea>
        ${state.template?.products?.length ? `<p class="muted" style="margin:8px 0 0;font-size:13.5px">This replaces your current shelf and weekly routine. Your ticks, ratings and notes stay.</p>` : ""}
        <button class="btn primary" data-act="import-text" style="justify-self:start;margin-top:10px">Import routine</button></div>
      <div class="sec plain"><h3>Or import a spreadsheet</h3>
        <p class="muted" style="margin:0 0 8px">Excel (.xlsx) or CSV, with columns <b>Brand</b>, <b>Product</b> and <b>When</b> (Morning, Evening or Both). Optional: <b>Step</b> (like Serum or Sunscreen) and <b>Days</b> (like Mon, Fri, for products you don't use every day). A Skin Diary routine file (.json) works here too.</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px"><label class="btn" style="cursor:pointer">Choose file<input type="file" accept=".xlsx,.xls,.csv,.ods,.json,application/json,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" data-act="import-file" hidden></label>
          <a class="btn" href="https://nurnhe.github.io/skin-diary/routine-template.xlsx" download target="_blank" rel="noopener">Get template</a></div></div>`;
  } else if (s.type === "day") {
    const d = fromKey(s.key), r = routineFor(s.key), day = r.day;
    title = d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
    sub = r.label ? esc(r.label) : "From your weekly template";
    const sec = slot => `<div class="sec ${slot}">
      <div class="sec-head"><h3>${slot === "am" ? "Morning" : "Evening"}</h3>
        <button class="done-btn" data-act="done-all" data-key="${s.key}" data-slot="${slot}" aria-pressed="${r[slot + "Done"]}">${r[slot + "Done"] ? "✓ All done" : "Tick all"}</button></div>
      ${warnings(slot, r[slot]).map(w => `<div class="warning">${esc(w)}</div>`).join("")}
      ${steps(s.key, r, slot, true)}
      <details id="plan-${slot}"${state.openPlan?.[slot] ? " open" : ""}><summary>Change products for this day</summary>
        <div style="display:grid;gap:8px;padding-top:8px">${r["custom" + (slot === "am" ? "Am" : "Pm")] ? `<button class="btn small" data-act="reset" data-slot="${slot}" style="justify-self:start">Back to template</button>` : ""}${picker(slot, r[slot])}</div></details></div>`;
    body = sec("am") + sec("pm") + `
      <div class="sec plain"><h3>How did your skin feel?</h3><div class="rating">${RATINGS.map(([n, l]) => `<button data-act="rate" data-n="${n}" aria-pressed="${day.rating === n}">${l}</button>`).join("")}</div></div>
      <div class="sec plain"><label for="note"><h3>Notes</h3></label>
        <textarea class="input" id="note" rows="4" placeholder="Breakouts, dry patches, a new product you tried…" style="resize:vertical">${esc(day.note || "")}</textarea></div>`;
  } else {
    const t = tplDay(s.dow);
    title = `Every ${DOW[s.dow]}`; sub = "Weekly template";
    const sec = slot => { const ids = sortIds(t[slot] || []); return `<div class="sec ${slot}"><div class="sec-head"><h3>${slot === "am" ? "Morning" : "Evening"}</h3></div>${warnings(slot, ids).map(w => `<div class="warning">${esc(w)}</div>`).join("")}${picker(slot, ids)}</div>` };
    body = `<label class="field">Name for this day<input class="input" type="text" id="tpl-label" value="${esc(t.label || "")}" placeholder="e.g. Retinol night"></label>` + sec("am") + sec("pm");
  }
  root.innerHTML = `<div class="scrim" data-act="close"></div><aside class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><div style="display:grid;gap:4px"><span class="eyebrow">${sub}</span><h2>${esc(title)}</h2></div><button class="btn small" data-act="close" aria-label="Close">Close</button></div>
    <div class="sheet-body">${body}</div></aside>`;
  root.querySelector(".sheet-body").scrollTop = scroll;
}

/* ---------- events ---------- */
document.addEventListener("toggle", e => { if (e.target.id?.startsWith("plan-")) (state.openPlan ??= {})[e.target.id.slice(5)] = e.target.open }, true);
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "tab") { state.tab = el.dataset.tab; state.sheet = null; render() }
  else if (act === "week") { const n = +el.dataset.n; state.weekStart = n ? addDays(state.weekStart, 7 * n) : mondayOf(new Date()); render() }
  else if (act === "open-day") { state.sheet = { type: "day", key: el.dataset.key }; state.openPlan = {}; render() }
  else if (act === "open-tpl") { state.sheet = { type: "tpl", dow: +el.dataset.dow }; render() }
  else if (act === "close") { flushNote(); state.sheet = null; render() }
  else if (act === "done-all") toggleAll(el.dataset.key, el.dataset.slot);
  else if (act === "skip") toggleSkip(el.dataset.key, el.dataset.slot, el.dataset.id);
  else if (act === "reset") { const s = state.sheet, day = { ...(state.days[s.key] || {}) }; delete day[el.dataset.slot]; saveDay(s.key, day) }
  else if (act === "rate") { const key = el.dataset.key || state.sheet.key, day = { ...(state.days[key] || {}) }, n = +el.dataset.n; day.rating = day.rating === n ? null : n; saveDay(key, day) }
  else if (act === "import-open") { state.sheet = { type: "import" }; render(); document.getElementById("imp-text")?.focus() }
  else if (act === "import-text") importText(document.getElementById("imp-text").value);
  else if (act === "backup") saveBackup();
  else if (act === "edit") { state.editProd = el.dataset.id; state.iconPick = null; render(); document.getElementById("e-name")?.focus() }
  else if (act === "edit-cancel") { state.editProd = null; render() }
  else if (act === "icon-open") { state.iconPick = state.iconPick === el.dataset.id ? null : el.dataset.id; render() }
  else if (act === "icon-set") { const tpl = structuredClone(state.template); tpl.products.find(p => p.id === el.dataset.id).icon = el.dataset.icon; state.iconPick = null; saveTemplate(tpl) }
  else if (act === "remove") { state.confirmRemove = el.dataset.id; render() }
  else if (act === "remove-no") { state.confirmRemove = null; render() }
  else if (act === "remove-yes") {
    const id = el.dataset.id, tpl = structuredClone(state.template);
    tpl.products = tpl.products.filter(p => p.id !== id);
    for (const k in tpl.week) for (const s of ["am", "pm"]) tpl.week[k][s] = (tpl.week[k][s] || []).filter(x => x !== id);
    state.confirmRemove = null; saveTemplate(tpl);
  }
  else if (act === "add-sugg") { const s = SUGGESTIONS[+el.dataset.i]; addProduct({ name: s.name, brand: s.brand, step: s.step, icon: s.icon, kinds: s.kinds }) }
});
document.addEventListener("change", e => {
  const el = e.target, act = el.dataset.act;
  if (act === "use") toggleUse(el.dataset.key, el.dataset.slot, el.dataset.id);
  else if (act === "restore" && el.files?.[0]) restoreBackup(el.files[0]);
  else if (act === "import-file" && el.files?.[0]) importFile(el.files[0]);
  else if (act === "pick") {
    const s = state.sheet, slot = el.dataset.slot, id = el.dataset.id;
    if (s.type === "day") {
      const r = routineFor(s.key), cur = r[slot], next = sortIds(el.checked ? [...cur, id] : cur.filter(x => x !== id));
      const tplIds = sortIds(tplDay(fromKey(s.key).getDay())[slot] || []);
      const day = { ...(state.days[s.key] || {}) };
      if (sameList(next, tplIds)) delete day[slot]; else day[slot] = next;
      saveDay(s.key, day);
    } else {
      const tpl = structuredClone(state.template); tpl.week = tpl.week || {};
      const t = tpl.week[s.dow] || { am: [], pm: [], label: "" }, cur = t[slot] || [];
      t[slot] = sortIds(el.checked ? [...cur, id] : cur.filter(x => x !== id)); tpl.week[s.dow] = t; saveTemplate(tpl);
    }
  } else if (act === "prod-step") { const tpl = structuredClone(state.template); tpl.products.find(p => p.id === el.dataset.id).step = +el.value; saveTemplate(tpl) }
});
let noteTimer = null, labelTimer = null;
function flushNote() {
  const n = document.getElementById("note"), s = state.sheet;
  if (n && s?.type === "day") { clearTimeout(noteTimer); const day = { ...(state.days[s.key] || {}) }; if ((day.note || "") !== n.value) { day.note = n.value; saveDay(s.key, day) } }
  const l = document.getElementById("tpl-label");
  if (l && s?.type === "tpl") { clearTimeout(labelTimer); const tpl = structuredClone(state.template); tpl.week = tpl.week || {}; const t = tpl.week[s.dow] || { am: [], pm: [], label: "" }; if ((t.label || "") !== l.value.trim()) { t.label = l.value.trim(); tpl.week[s.dow] = t; saveTemplate(tpl) } }
}
document.addEventListener("input", e => {
  if (e.target.id === "imp-text" && state.sheet?.type === "import") state.sheet.text = e.target.value;
  if (e.target.id === "note") { clearTimeout(noteTimer); noteTimer = setTimeout(flushNote, 700) }
  if (e.target.id === "tpl-label") { clearTimeout(labelTimer); labelTimer = setTimeout(flushNote, 700) }
});
document.addEventListener("focusout", e => { if (e.target.id === "note" || e.target.id === "tpl-label") setTimeout(() => { flushNote(); renderSheet() }, 0) });
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.sheet) { flushNote(); state.sheet = null; render() } });
document.addEventListener("submit", e => {
  if (e.target.id === "editForm") {
    e.preventDefault();
    const tpl = structuredClone(state.template), p = tpl.products.find(x => x.id === e.target.dataset.id), v = id => document.getElementById(id).value.trim();
    p.brand = v("e-brand"); p.name = v("e-name") || p.name; delete p.short;
    p.kinds = Object.keys(KINDS).filter(k => document.getElementById("e-k-" + k).checked);
    state.editProd = null; document.activeElement?.blur(); saveTemplate(tpl); toast("Saved."); return;
  }
  if (e.target.id !== "addForm") return; e.preventDefault(); document.activeElement?.blur();
  const v = id => document.getElementById(id).value.trim();
  addProduct({ brand: v("f-brand"), name: v("f-name"), step: +v("f-step"), kinds: Object.keys(KINDS).filter(k => document.getElementById("f-k-" + k).checked) });
});
function saveBackup() {
  const blob = new Blob([JSON.stringify({ app: "skin-diary", version: 1, savedAt: new Date().toISOString(), template: state.template, days: state.days }, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `skin-diary-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function restoreBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data?.app !== "skin-diary" || !data.template?.products) throw new Error("not a backup");
    state.template = data.template; state.days = data.days || {}; persistLocal(); render(); toast("Diary restored.");
  } catch (e) { toast("That file isn't a Skin Diary backup.") }
}
/* Import: a pasted list (Morning / Evening headings, "Brand - Name" per line) or a Skin Diary file. */
const GUESS = [[0, /balm|cleansing oil|make-?up remov|micellar/], [8, /\bspf\b|sunscreen|sun ?cream|sun ?stick|\bsun\b|\buv/], [5, /retin|tretinoin|adapalene/], [1, /cleans|foam|face ?wash|wash\b/],
  [2, /\b[abp]ha\b|exfoliat|peel|glycolic|salicylic|lactic|mandelic/], [3, /toner|essence|mist|skin ?water/], [4, /serum|ampoule|ampule|booster|vitamin c|vita c|niacinamide/],
  [6, /cream|lotion|moistur|gel|emulsion/], [7, /oil|sleeping|mask|ointment/]];
function guessProduct(text) {
  const t = text.toLowerCase(), kinds = [];
  if (/retin|tretinoin|adapalene/.test(t)) kinds.push("retinoid");
  if (/\b[abp]ha\b|glycolic|salicylic|lactic|mandelic|exfoliat|peel/.test(t)) kinds.push("acid");
  if (/\bspf\b|sunscreen|sun ?cream|sun ?stick/.test(t)) kinds.push("spf");
  if (/vitamin c|vita c|ascorbic/.test(t)) kinds.push("vitc");
  return { step: (GUESS.find(([, re]) => re.test(t)) || [4])[0], kinds };
}
function parseRoutine(text) {
  const items = new Map(); let section = "both";
  for (let line of text.split(/\r?\n/)) {
    line = line.replace(/^\s*([-*•·]|\d+[.)])\s+/, "").trim();
    if (!line) continue;
    const head = line.match(/^(morning|am|a\.m\.|day|evening|night|pm|p\.m\.|both|every ?day)\b\s*(?:routine)?\s*(?::\s*(.*))?$/i);
    if (head) { section = /^(morning|am|a\.m\.|day)/i.test(head[1]) ? "am" : /^(evening|night|pm|p\.m\.)/i.test(head[1]) ? "pm" : "both"; line = (head[2] || "").trim(); if (!line) continue }
    const parts = line.split(/\s+[-–—]\s+/), brand = parts.length > 1 ? parts.shift().trim() : "", name = parts.join(" - ").trim();
    addItem(items, { brand, name, ...guessProduct(line) }, section, null);
  }
  return buildTemplate([...items.values()]);
}
/* Spreadsheet rows: a header row with Brand, Product, When (Morning / Evening / Both), and optional Step and Days columns. */
const DAY_NAMES = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
function parseRows(rows) {
  rows = rows.map(r => r.map(c => String(c ?? "").trim())).filter(r => r.some(Boolean));
  const hi = rows.slice(0, 5).findIndex(r => r.some(c => /^(product|product name|name)$/i.test(c)));
  if (hi < 0) return parseRoutine(rows.map(r => r.filter(Boolean).join(" - ")).join("\n"));
  const col = re => rows[hi].findIndex(c => re.test(c));
  const ci = { brand: col(/^brand/i), name: col(/^(product|product name|name)$/i), when: col(/^(when|time|routine|am ?\/ ?pm|morning ?\/ ?evening)/i), step: col(/^(step|type|category)/i), days: col(/^days?$/i) };
  const items = new Map(), get = (r, k) => ci[k] < 0 ? "" : r[ci[k]] || "";
  for (const r of rows.slice(hi + 1)) {
    const name = get(r, "name"); if (!name) continue;
    const brand = get(r, "brand"), when = get(r, "when").toLowerCase(), stepText = get(r, "step").toLowerCase();
    const guess = guessProduct(brand + " " + name + " " + stepText);
    const named = Object.entries(STEPS).find(([, l]) => stepText && (stepText.includes(l.toLowerCase()) || l.toLowerCase().includes(stepText)));
    const fromStep = stepText && guessProduct(stepText);
    const step = named ? +named[0] : fromStep && GUESS.some(([, re]) => re.test(stepText)) ? fromStep.step : guess.step;
    const section = /^(am|a\.m\.|morning|day)/.test(when) ? "am" : /^(pm|p\.m\.|evening|night)/.test(when) ? "pm" : "both";
    const dayText = get(r, "days").toLowerCase();
    const days = !dayText || /every|daily|all/.test(dayText) ? null : new Set(DAY_NAMES.map((d, i) => dayText.includes(d) ? i : -1).filter(i => i >= 0));
    addItem(items, { brand, name, step, kinds: guess.kinds }, section, days && days.size ? days : null);
  }
  return buildTemplate([...items.values()]);
}
function addItem(items, p, section, days) {
  const key = (p.brand + "|" + p.name).toLowerCase();
  if (!items.has(key)) items.set(key, { ...p, am: null, pm: null });
  const it = items.get(key), all = new Set([0, 1, 2, 3, 4, 5, 6]), d = days || all;
  const put = slot => { it[slot] = it[slot] || new Set(); d.forEach(x => it[slot].add(x)) };
  if (section === "both") { if (!it.kinds.some(k => k === "retinoid" || k === "acid")) put("am"); if (!it.kinds.includes("spf")) put("pm") }
  else put(section);
}
function buildTemplate(list) {
  const stamp = Date.now().toString(36);
  const prods = list.map((it, i) => ({ id: `p_${stamp}_${i}`, name: it.name, brand: it.brand, step: it.step, kinds: it.kinds }));
  const ids = (slot, dow) => prods.filter((p, i) => list[i][slot]?.has(dow)).sort((a, b) => a.step - b.step).map(p => p.id);
  const week = {}; for (let d = 0; d < 7; d++) week[d] = { label: "", am: ids("am", d), pm: ids("pm", d) };
  return { products: prods, week };
}
function finishImport(tpl) {
  state.sheet = null; state.tab = isMobile() ? "today" : "week"; saveTemplate(tpl);
  toast(`Imported ${tpl.products.length} product${tpl.products.length === 1 ? "" : "s"}. Check the steps on your shelf, and tap a weekday under Routine to change a day.`);
}
function importText(text) {
  const tpl = parseRoutine(text || "");
  if (!tpl.products.length) { toast("Paste at least one product first."); return }
  finishImport(tpl);
}
const XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
function loadXlsx() {
  return window.XLSX ? Promise.resolve(window.XLSX) : new Promise((ok, fail) => {
    const sc = document.createElement("script"); sc.src = XLSX_URL; sc.onload = () => ok(window.XLSX); sc.onerror = fail; document.head.appendChild(sc);
  });
}
async function importFile(file) {
  if (!/\.json$/i.test(file.name)) {
    try {
      const X = await loadXlsx(), wb = X.read(await file.arrayBuffer()), ws = wb.Sheets[wb.SheetNames[0]];
      const tpl = parseRows(X.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false }));
      if (!tpl.products.length) { toast("Couldn't find any products in that spreadsheet."); return }
      finishImport(tpl);
    } catch (e) { toast(navigator.onLine === false ? "Connect to the internet to import a spreadsheet." : "Couldn't read that spreadsheet.") }
    return;
  }
  try {
    const data = JSON.parse(await file.text()), tpl = data?.template;
    if (!Array.isArray(tpl?.products) || typeof tpl.week !== "object") throw new Error("no routine");
    finishImport({ products: tpl.products, week: tpl.week });
  } catch (e) { toast("That file doesn't have a Skin Diary routine in it.") }
}
function addProduct(p) {
  const tpl = structuredClone(state.template || { products: [], week: {} });
  tpl.products.push({ id: "p_" + Date.now().toString(36), name: p.name, brand: p.brand, step: p.step, kinds: p.kinds, ...(p.icon ? { icon: p.icon } : {}) });
  saveTemplate(tpl); toast(`Added ${p.name}. Tap its icon to change it, and pick it in the weekly template or on a single day.`);
}

/* ---------- boot ---------- */
document.querySelectorAll("[data-nav]").forEach(svg => { const n = svg.dataset.nav; svg.innerHTML = n === "products" ? ICONS.bottle.d : NAV_ICONS[n] });
mobileMQ.addEventListener?.("change", () => { if (!isMobile() && state.tab === "today") state.tab = "week"; render() });
render();
(async () => {
  try { db = window.claude?.use ? await window.claude.use("db") : null } catch (e) { db = null }
  if (!db) { loadLocal(); return }
  state.mode = "db";
  db.doc("routine/template").onSnapshot(s => { state.template = s.exists ? s.data() : null; state.tplLoaded = true; render() },
    () => { setStatus("Lost the connection to your saved diary. Reload the page to reconnect.") });
  db.collection("days").onSnapshot(q => { const d = {}; q.docs.forEach(x => d[x.id] = x.data()); state.days = d; render() },
    () => { setStatus("Lost the connection to your saved diary. Reload the page to reconnect.") });
})();
</script>
